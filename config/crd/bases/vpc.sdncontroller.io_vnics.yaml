---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vnics.vpc.sdncontroller.io
spec:
  group: vpc.sdncontroller.io
  names:
    kind: VNic
    listKind: VNicList
    plural: vnics
    shortNames:
    - vnic
    singular: vnic
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subnetRef
      name: Subnet
      type: string
    - jsonPath: .status.ipAddress
      name: IP
      type: string
    - jsonPath: .status.macAddress
      name: MAC
      type: string
    - jsonPath: .spec.attachment.name
      name: Workload
      type: string
    - jsonPath: .status.boundNode
      name: Node
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VNic is a virtual network interface of a workload (VM, VNF, pod) in a subnet.
          It owns an IPAM address and a MAC, and is bound to an OVS port by the node agent.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VNicSpec defines the desired state of VNic.
            properties:
              attachment:
                description: attachment is the workload that owns this VNic.
                properties:
                  kind:
                    default: VM
                    description: kind of workload.
                    enum:
                    - VM
                    - VNF
                    - Pod
                    - Other
                    type: string
                  name:
                    description: name of the workload (libvirt domain, VNF name, pod
                      name).
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              firewallRef:
                description: firewallRef optionally names a Firewall that applies
                  to this VNic.
                type: string
              ipAddress:
                description: ipAddress requests a specific address from the subnet;
                  allocated automatically if empty.
                pattern: ^(\d{1,3}\.){3}\d{1,3}$
                type: string
              macAddress:
                description: macAddress requests a specific MAC; generated deterministically
                  if empty.
                pattern: ^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$
                type: string
              mtu:
                description: mtu overrides the VPC MTU for this VNic.
                format: int32
                maximum: 9216
                minimum: 1280
                type: integer
              nodeName:
                description: nodeName pins the VNic to a node. The node agent on that
                  node binds the OVS port.
                type: string
              portSecurity:
                default: true
                description: portSecurity drops traffic from this port whose source
                  MAC/IP differ from the VNic's.
                type: boolean
              subnetRef:
                description: subnetRef is the Subnet this VNic is attached to. The
                  VPC is derived from it.
                minLength: 1
                type: string
            required:
            - subnetRef
            type: object
          status:
            description: VNicStatus defines the observed state of VNic.
            properties:
              boundNode:
                description: boundNode is the node whose agent bound the port.
                type: string
              bridge:
                description: bridge is the OVS bridge holding the port.
                type: string
              conditions:
                description: conditions represent the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gateway:
                description: gateway is the subnet gateway for this VNic.
                type: string
              ipAddress:
                description: ipAddress is the allocated address.
                type: string
              macAddress:
                description: macAddress is the effective MAC.
                type: string
              mtu:
                description: mtu is the effective MTU.
                format: int32
                type: integer
              ofPort:
                description: ofPort is the OpenFlow port number.
                format: int32
                type: integer
              ovsPort:
                description: ovsPort is the OVS interface name (e.g. the libvirt vnetN
                  tap).
                type: string
              phase:
                description: phase is the lifecycle phase. Bound means a node agent
                  found the port and programmed it.
                enum:
                - Pending
                - Allocated
                - Bound
                - Deleting
                - Failed
                type: string
              prefixLength:
                description: prefixLength is the subnet prefix length.
                format: int32
                type: integer
              vpcRef:
                description: vpcRef is the VPC derived from the subnet.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
