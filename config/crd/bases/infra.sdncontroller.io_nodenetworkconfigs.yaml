                - BareMetal
                - VM
                type: string
              ovsBridges:
                description: ovsBridges defines the OVS bridges to create on this
                  node.
                items:
                  description: OVSBridge defines an OVS bridge configuration.
                  properties:
                    datapathType:
                      default: system
                      description: datapathType is the OVS datapath type.
                      enum:
                      - system
                      - netdev
                      type: string
                    name:
                      description: name is the bridge name.
                      type: string
                    type:
                      description: type is the bridge role.
                      enum:
                      - integration
                      - external
                      - tunnel
                      type: string
                    uplinks:
                      description: uplinks are physical interfaces attached to this
                        bridge.
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  - type
                  type: object
                type: array
              tunnelProtocol:
