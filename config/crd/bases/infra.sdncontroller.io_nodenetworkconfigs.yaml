        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeNetworkConfigSpec defines the desired state of NodeNetworkConfig.
            properties:
              computeType:
                default: CPU
                description: computeType is the compute workload type.
                enum:
                - CPU
                - GPU
                type: string
              defaultMTU:
                default: 1500
                description: defaultMTU is the default MTU for this node.
                format: int32
                maximum: 9216
                minimum: 1280
                type: integer
              dpuDevice:
                description: dpuDevice is the DPU model (e.g., bf2, bf3).
                type: string
              dpuEnabled:
                default: false
                description: dpuEnabled indicates DPU offload support.
                type: boolean
              hardware:
                description: hardware describes the physical NIC configuration.
                properties:
                  nics:
                    description: nics lists all discovered NICs.
                    items:
                      description: NICInfo describes a discovered NIC on the node.
                      properties:
                        device:
                          description: device is the Linux device name.
                          type: string
                        model:
                          description: model is the hardware model.
                          type: string
                        numVFs:
                          description: numVFs is the number of virtual functions configured.
                          format: int32
                          type: integer
                        offloadCapable:
                          description: offloadCapable indicates hardware offload support.
                          type: boolean
                        switchdevMode:
                          description: switchdevMode indicates if switchdev is enabled.
                          type: boolean
                        vendor:
                          description: vendor is the hardware vendor.
                          type: string
                      required:
                      - device
                      type: object
                    type: array
                type: object
              libvirt:
                description: libvirt configures libvirt integration for VM hosts.
                properties:
                  bridgeMapping:
                    additionalProperties:
                      type: string
