---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: servicechains.nfv.sdncontroller.io
spec:
  group: nfv.sdncontroller.io
  names:
    kind: ServiceChain
    listKind: ServiceChainList
    plural: servicechains
    shortNames:
    - sc
    singular: servicechain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcRef
      name: VPC
      type: string
    - jsonPath: .spec.direction
      name: Direction
      type: string
    - jsonPath: .status.chainLength
      name: Hops
      type: integer
    - jsonPath: .status.processedPackets
      name: Packets
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ServiceChain steers traffic through an ordered sequence of VNFs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServiceChainSpec defines the desired state of ServiceChain.
            properties:
              chain:
                description: chain is the ordered list of VNF hops.
                items:
                  description: ChainElement is one hop in a service chain.
                  properties:
                    name:
                      description: name is the human-readable name for this hop.
                      type: string
                    portPair:
                      description: portPair maps the ingress and egress ports.
                      properties:
                        egress:
                          description: egress is the VNF egress port name.
                          type: string
                        ingress:
                          description: ingress is the VNF ingress port name.
                          type: string
                      required:
                      - egress
                      - ingress
                      type: object
                    vnfRef:
                      description: vnfRef references the VirtualNetworkFunction.
                      type: string
                  required:
                  - name
                  - portPair
                  - vnfRef
                  type: object
                minItems: 1
                type: array
              direction:
                default: Ingress
                description: direction defines which traffic direction this chain
                  applies to.
                enum:
                - Ingress
                - Egress
                - Both
                type: string
              match:
                description: match defines what traffic enters this chain.
                properties:
                  dstCIDR:
                    description: dstCIDR is the destination network.
                    type: string
                  dstPort:
                    description: dstPort is the destination port.
                    format: int32
                    type: integer
                  protocol:
                    description: protocol is the L4 protocol to match.
                    type: string
                  srcCIDR:
                    description: srcCIDR is the source network.
                    type: string
                type: object
              nodeSelector:
                description: nodeSelector targets specific nodes.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              offload:
                description: offload enables hardware offload for chain steering.
                properties:
                  enabled:
                    default: false
                    description: enabled activates hardware offload for chain steering
                      flows.
                    type: boolean
                required:
                - enabled
                type: object
              subnetRef:
                description: subnetRef is the name of the Subnet.
                type: string
              vpcRef:
                description: vpcRef is the name of the VPC.
                type: string
            required:
            - chain
            - vpcRef
            type: object
          status:
            description: ServiceChainStatus defines the observed state of ServiceChain.
            properties:
              chainLength:
                description: chainLength is the number of active hops.
                format: int32
                type: integer
              conditions:
                description: conditions represent the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodes:
                description: |-
                  nodes lists the hosts this resource is running on (Ready nodes matching
                  nodeSelector that are attached to the VPC).
                items:
                  type: string
                type: array
              phase:
                description: phase is the current lifecycle phase.
                enum:
                - Pending
                - Active
                - Degraded
                - Failed
                type: string
              processedPackets:
                description: processedPackets is the total packet count through this
                  chain.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
