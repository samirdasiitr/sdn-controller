---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vpcs.vpc.sdncontroller.io
spec:
  group: vpc.sdncontroller.io
  names:
    kind: VPC
    listKind: VPCList
    plural: vpcs
    shortNames:
    - vpc
    singular: vpc
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cidr
      name: CIDR
      type: string
    - jsonPath: .spec.tunnelType
      name: Tunnel
      type: string
    - jsonPath: .status.allocatedVNI
      name: VNI
      type: integer
    - jsonPath: .spec.mtu
      name: MTU
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VPC is a virtual private cloud providing isolated network space with its own
          CIDR block, VXLAN overlay, and routing domain.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VPCSpec defines the desired state of VPC.
            properties:
              cidr:
                description: cidr is the primary IPv4 CIDR block for this VPC.
                pattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
                type: string
              enableDNS:
                default: true
                description: enableDNS enables internal DNS resolution within the
                  VPC.
                type: boolean
              mtu:
                default: 1500
                description: mtu is the Maximum Transmission Unit for this VPC.
                format: int32
                maximum: 9216
                minimum: 1280
                type: integer
              nodeSelector:
                description: nodeSelector targets specific nodes that participate
                  in this VPC.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              secondaryCIDRs:
                description: secondaryCIDRs are additional CIDR blocks for this VPC.
                items:
                  type: string
                type: array
              tunnelType:
                default: VXLAN
                description: tunnelType specifies the overlay encapsulation for cross-node
                  traffic.
                enum:
                - VXLAN
                - IPIP
                - GRE
                type: string
              vni:
                description: |-
                  vni is the VXLAN/GRE Network Identifier for overlay isolation.
                  Required for VXLAN and GRE tunnel types. Must be unique across VPCs.
                  The same VNI is used on all nodes to establish tunnels for this VPC.
                format: int32
                maximum: 16777215
                minimum: 1
                type: integer
            required:
            - cidr
            type: object
          status:
            description: VPCStatus defines the observed state of VPC.
            properties:
              activeNodes:
                description: activeNodes is the number of nodes participating in this
                  VPC.
                format: int32
                type: integer
              allocatedSubnets:
                description: allocatedSubnets is the number of subnets in this VPC.
                format: int32
                type: integer
              allocatedVNI:
                description: allocatedVNI is the VNI assigned to this VPC.
                format: int32
                type: integer
              attachedNodes:
                description: |-
                  attachedNodes lists the nodes that participate in this VPC.
                  Node agents watch this to create bridges, tunnels and flows.
                items:
                  description: VPCNodeAttachment describes one node participating
                    in a VPC.
                  properties:
                    bridge:
                      description: bridge is the OVS bridge created for this VPC on
                        the node.
                      type: string
                    nodeName:
                      description: nodeName is the Kubernetes node name.
                      type: string
                    tunnelIP:
                      description: tunnelIP is the underlay IP the node uses as tunnel
                        endpoint.
                      type: string
                  required:
                  - nodeName
                  type: object
                type: array
              conditions:
                description: conditions represent the current state of the VPC resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                description: phase is the current lifecycle phase of the VPC.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Deleting
                - Failed
                type: string
              routes:
                description: |-
                  routes is the route table distributed via the Kubernetes API (replaces BGP).
                  Every node agent programs these into its local OVS pipeline.
                items:
                  description: VPCRoute is a single route in the VPC route table.
                  properties:
                    destination:
                      description: destination is the destination CIDR.
                      type: string
                    nextHopIP:
                      description: nextHopIP is the tunnel endpoint IP of nextHopNode.
                      type: string
                    nextHopNode:
                      description: nextHopNode is the node hosting the destination
                        subnet (tunnel next hop).
                      type: string
                    type:
                      description: type is Local, Tunnel or Gateway.
                      type: string
                  required:
                  - destination
                  type: object
                type: array
              usedBy:
                description: usedBy lists dependent resources (kind/name) that block
                  deletion.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
