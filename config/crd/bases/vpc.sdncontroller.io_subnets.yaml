    - sn
    singular: subnet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcRef
      name: VPC
      type: string
    - jsonPath: .spec.cidr
      name: CIDR
      type: string
