    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Subnet is a network segment within a VPC with its own CIDR, gateway,
          and DHCP.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SubnetSpec defines the desired state of Subnet.
            properties:
              cidr:
                description: cidr is the IPv4 CIDR block for this subnet.
                pattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
                type: string
              dhcp:
                description: dhcp configures the DHCP server for this subnet.
                properties:
                  dns:
                    description: dns specifies DNS server addresses.
                    items:
                      type: string
                    type: array
                  enabled:
                    default: true
                    description: enabled activates the DHCP server for this subnet.
                    type: boolean
                  range:
                    description: range defines the IP allocation range.
                    properties:
                      end:
                        description: end is the last IP in the DHCP range.
                        type: string
                      start:
                        description: start is the first IP in the DHCP range.
                        type: string
                    required:
                    - end
                    - start
                    type: object
                required:
                - enabled
                type: object
              gateway:
                description: |-
                  gateway is the default gateway IP for this subnet.
                  Auto-calculated as first usable IP if not set.
                type: string
              mtu:
                description: mtu overrides the VPC MTU for this subnet.
                format: int32
                maximum: 9216
                minimum: 1280
                type: integer
              nodeSelector:
                description: nodeSelector targets specific nodes for this subnet.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              type:
                default: Private
                description: type defines whether this subnet is Public or Private.
                enum:
                - Private
                - Public
                type: string
              vlanID:
                description: vlanID is an optional 802.1Q VLAN tag for this subnet.
                format: int32
                maximum: 4094
                minimum: 1
                type: integer
              vpcRef:
