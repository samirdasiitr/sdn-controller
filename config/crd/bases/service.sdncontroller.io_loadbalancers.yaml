---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: loadbalancers.service.sdncontroller.io
spec:
  group: service.sdncontroller.io
  names:
    kind: LoadBalancer
    listKind: LoadBalancerList
    plural: loadbalancers
    shortNames:
    - lb
    singular: loadbalancer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcRef
      name: VPC
      type: string
    - jsonPath: .spec.frontend.ip
      name: VIP
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.algorithm
      name: Algorithm
      type: string
    - jsonPath: .status.activeBackends
      name: Backends
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LoadBalancer distributes traffic across backend servers using
          configurable algorithms.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LoadBalancerSpec defines the desired state of LoadBalancer.
            properties:
              algorithm:
                default: RoundRobin
                description: algorithm is the load balancing algorithm.
                enum:
                - RoundRobin
                - LeastConn
                - IPHash
                - Maglev
                type: string
              backends:
                description: backends are the backend server pool.
                items:
                  description: LBBackend defines a backend server.
                  properties:
                    ip:
                      description: ip is the backend server IP.
                      type: string
                    weight:
                      default: 100
                      description: weight is the relative weight for weighted algorithms.
                      format: int32
                      maximum: 1000
                      minimum: 0
                      type: integer
                  required:
                  - ip
                  type: object
                minItems: 1
                type: array
              frontend:
                description: frontend defines the VIP and listener ports.
                properties:
                  ip:
                    description: ip is the virtual IP address.
                    type: string
                  ports:
                    description: ports are the frontend listener ports.
                    items:
                      description: LBPort defines a single port mapping.
                      properties:
                        port:
                          description: port is the frontend port.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        protocol:
                          description: protocol is the L4 protocol.
                          enum:
                          - TCP
                          - UDP
                          - SCTP
                          type: string
                        targetPort:
                          description: targetPort is the backend port.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                      required:
                      - port
                      - protocol
                      - targetPort
                      type: object
                    minItems: 1
                    type: array
                required:
                - ip
                - ports
                type: object
              healthCheck:
                description: healthCheck configures backend health monitoring.
                properties:
                  interval:
                    default: 10s
                    description: interval is the time between health checks.
                    type: string
                  path:
                    description: path is the HTTP health check path (only for HTTP/HTTPS).
                    type: string
                  port:
                    description: port is the health check port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  protocol:
                    description: protocol is the health check protocol.
                    enum:
                    - TCP
                    - HTTP
                    - HTTPS
                    type: string
                  timeout:
                    default: 5s
                    description: timeout is the health check timeout.
                    type: string
                  unhealthyThreshold:
                    default: 3
                    description: unhealthyThreshold is the number of consecutive failures
                      to mark unhealthy.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - port
                - protocol
                type: object
              nodeSelector:
                description: nodeSelector targets specific nodes.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              sessionAffinity:
                description: sessionAffinity configures session persistence.
                properties:
                  enabled:
                    description: enabled activates session affinity.
                    type: boolean
                  timeout:
                    default: 3600s
                    description: timeout is the session sticky timeout.
                    type: string
                required:
                - enabled
                type: object
              type:
                default: L4
                description: type is the LB layer (L4 or L7).
                enum:
                - L4
                - L7
                type: string
              vpcRef:
                description: vpcRef is the name of the VPC.
                type: string
            required:
            - backends
            - frontend
            - vpcRef
            type: object
          status:
            description: LoadBalancerStatus defines the observed state of LoadBalancer.
            properties:
              activeBackends:
                description: activeBackends is the number of healthy backends.
                format: int32
                type: integer
              activeConnections:
                description: activeConnections is the number of connections currently
                  tracked, summed over nodes.
                format: int64
                type: integer
              backends:
                description: backends is the health of each backend.
                items:
                  description: BackendStatus is the observed health of one backend,
                    written by the router node's prober.
                  properties:
                    healthy:
                      description: healthy is false after unhealthyThreshold consecutive
                        failed checks.
                      type: boolean
                    ip:
                      description: ip of the backend.
                      type: string
                    mac:
                      description: mac is the backend's MAC when it is not a VNic
                        (learned from the router node's ARP cache).
                      type: string
                    message:
                      description: message explains an unhealthy backend.
                      type: string
                  required:
                  - healthy
                  - ip
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - ip
                x-kubernetes-list-type: map
              conditions:
                description: conditions represent the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              enforcement:
                additionalProperties:
                  description: |-
                    EnforcementStatus is reported by each node agent after it programs its OVS
                    pipeline for this object. It is keyed by node name in status.enforcement.
                  properties:
                    bytes:
                      format: int64
                      type: integer
                    connections:
                      description: connections is the number of connections currently
                        tracked on the node (load balancers).
                      format: int64
                      type: integer
                    flows:
                      description: flows is the number of OpenFlow rules installed
                        for this object on the node.
                      format: int32
                      type: integer
                    matchedPackets:
                      description: matchedPackets is the packet count of this object's
                        rules on the node (firewalls).
                      format: int64
                      type: integer
                    message:
                      description: message carries the error when programming failed.
                      type: string
                    newConnections:
                      description: newConnections is the cumulative number of connections
                        load-balanced on the node.
                      format: int64
                      type: integer
                    observedGeneration:
                      description: observedGeneration is the spec generation the agent
                        compiled and installed.
                      format: int64
                      type: integer
                    packets:
                      description: packets and bytes are cumulative counters of the
                        object's main flows on the node.
                      format: int64
                      type: integer
                    programmed:
                      description: programmed is true when the flows for this generation
                        are installed.
                      type: boolean
                    rules:
                      description: rules are cumulative per-rule counters on the node
                        (firewalls).
                      items:
                        description: RuleCounter is the cumulative traffic matched
                          by one firewall rule.
                        properties:
                          action:
                            type: string
                          bytes:
                            format: int64
                            type: integer
                          name:
                            type: string
                          packets:
                            format: int64
                            type: integer
                        required:
                        - action
                        - bytes
                        - name
                        - packets
                        type: object
                      type: array
                    warnings:
                      description: warnings are non-fatal limitations (e.g. health
                        checks not implemented).
                      items:
                        type: string
                      type: array
                  required:
                  - observedGeneration
                  - programmed
                  type: object
                description: enforcement is what each node agent actually programmed,
                  keyed by node name.
                type: object
              nodes:
                description: |-
                  nodes lists the hosts this resource is running on (Ready nodes matching
                  nodeSelector that are attached to the VPC).
                items:
                  type: string
                type: array
              phase:
                description: phase is the current lifecycle phase.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                - Failed
                type: string
              totalConnections:
                description: totalConnections is the cumulative number of connections
                  load-balanced (all nodes).
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
