# This rule is not used by the project sdncontroller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to service.sdncontroller.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/managed-by: kustomize
  name: service-firewall-viewer-role
rules:
- apiGroups:
  - service.sdncontroller.io
  resources:
  - firewalls
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - service.sdncontroller.io
  resources:
  - firewalls/status
  verbs:
  - get
