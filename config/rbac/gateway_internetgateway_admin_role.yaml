# This rule is not used by the project sdncontroller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over gateway.sdncontroller.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/managed-by: kustomize
  name: gateway-internetgateway-admin-role
rules:
- apiGroups:
  - gateway.sdncontroller.io
  resources:
  - internetgateways
  verbs:
  - '*'
- apiGroups:
  - gateway.sdncontroller.io
  resources:
  - internetgateways/status
  verbs:
  - get
