# This rule is not used by the project sdncontroller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the vpc.sdncontroller.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/managed-by: kustomize
  name: vpc-subnet-editor-role
rules:
- apiGroups:
  - vpc.sdncontroller.io
  resources:
  - subnets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vpc.sdncontroller.io
  resources:
  - subnets/status
  verbs:
  - get
