global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: sdn-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - 192.168.150.10:30080
        labels:
          component: controller-manager

  - job_name: sdn-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.150.11:9101"]
        labels: {component: node-agent, node: sdn-node-1}
      - targets: ["192.168.150.12:9101"]
        labels: {component: node-agent, node: sdn-node-2}
