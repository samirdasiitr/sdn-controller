global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: sdn-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.17.0.1:8080
        labels:
          component: controller-manager
