apiVersion: v1
kind: Namespace
metadata: {name: sdn-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sdn-controller, namespace: sdn-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sdn-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: manager-role}
subjects: [{kind: ServiceAccount, name: sdn-controller, namespace: sdn-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: sdn-controller-leader-election}
rules:
  - {apiGroups: ["coordination.k8s.io"], resources: [leases], verbs: [get, list, watch, create, update, patch, delete]}
  - {apiGroups: [""], resources: [events], verbs: [create, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sdn-controller-leader-election}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sdn-controller-leader-election}
subjects: [{kind: ServiceAccount, name: sdn-controller, namespace: sdn-system}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sdn-agent, namespace: sdn-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: sdn-agent}
rules:
  - apiGroups: [vpc.sdncontroller.io, gateway.sdncontroller.io, service.sdncontroller.io, infra.sdncontroller.io, nfv.sdncontroller.io]
    resources: ["*"]
    verbs: [get, list, watch, update, patch, create]
  - {apiGroups: [""], resources: [nodes], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sdn-agent}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sdn-agent}
subjects: [{kind: ServiceAccount, name: sdn-agent, namespace: sdn-system}]
