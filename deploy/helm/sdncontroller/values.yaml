# Controller-manager configuration
controller:
  image:
    repository: sdncontroller/controller
    tag: latest
  replicas: 2
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  leaderElect: true

# Node-agent configuration
agent:
  image:
    repository: sdncontroller/agent
    tag: latest
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  ovsSocket: /var/run/openvswitch/db.sock

# Telemetry configuration
telemetry:
  enabled: true
  otlpEndpoint: otel-collector:4317

# Grafana configuration
grafana:
  enabled: true
  image: grafana/grafana:10.3.0

# Prometheus configuration
prometheus:
  enabled: true

# OpenTelemetry Collector configuration
otelCollector:
  enabled: true
  image: otel/opentelemetry-collector-contrib:0.96.0
