# Controller ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sdncontroller-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/component: controller-manager
---
# Agent ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sdncontroller-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/component: agent
---
# Controller ClusterRole - full access to all sdncontroller.io CRDs and read on nodes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sdncontroller-controller
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/component: controller-manager
rules:
  - apiGroups:
      - vpc.sdncontroller.io
      - gateway.sdncontroller.io
      - service.sdncontroller.io
      - infra.sdncontroller.io
      - nfv.sdncontroller.io
    resources:
      - "*"
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - vpc.sdncontroller.io
      - gateway.sdncontroller.io
      - service.sdncontroller.io
      - infra.sdncontroller.io
      - nfv.sdncontroller.io
    resources:
      - "*/status"
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
# Agent ClusterRole - read access to all sdncontroller.io CRDs, update status
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sdncontroller-agent
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/component: agent
rules:
  - apiGroups:
      - vpc.sdncontroller.io
      - gateway.sdncontroller.io
      - service.sdncontroller.io
      - infra.sdncontroller.io
      - nfv.sdncontroller.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - vpc.sdncontroller.io
      - gateway.sdncontroller.io
      - service.sdncontroller.io
      - infra.sdncontroller.io
      - nfv.sdncontroller.io
    resources:
      - "*/status"
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
---
# Controller ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sdncontroller-controller
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/component: controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sdncontroller-controller
subjects:
  - kind: ServiceAccount
    name: sdncontroller-controller
    namespace: {{ .Release.Namespace }}
---
# Agent ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sdncontroller-agent
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sdncontroller-agent
subjects:
  - kind: ServiceAccount
    name: sdncontroller-agent
    namespace: {{ .Release.Namespace }}
