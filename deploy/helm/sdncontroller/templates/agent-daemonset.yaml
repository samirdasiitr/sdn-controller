apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sdncontroller-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/component: agent
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sdncontroller
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdncontroller
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: sdncontroller-agent
      hostNetwork: true
      hostPID: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: node-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          args:
            - --node-name=$(NODE_NAME)
            - --otlp-endpoint={{ .Values.telemetry.otlpEndpoint }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: openvswitch
              mountPath: /var/run/openvswitch
            - name: sys
              mountPath: /sys
              readOnly: true
      volumes:
        - name: openvswitch
          hostPath:
            path: /var/run/openvswitch
            type: DirectoryOrCreate
        - name: sys
          hostPath:
            path: /sys
            type: Directory
