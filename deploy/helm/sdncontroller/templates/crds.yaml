# CRDs are installed separately via kustomize or make install.
# Run 'make install' or 'kustomize build config/crd | kubectl apply -f -'
# to install the CRDs before deploying this Helm chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sdncontroller-crd-info
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  install-note: |
    CRDs for sdncontroller.io are managed outside of this Helm chart.
    Install them using: make install
    Or: kustomize build config/crd | kubectl apply -f -
