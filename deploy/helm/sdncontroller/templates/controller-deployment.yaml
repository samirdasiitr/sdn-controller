apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdncontroller-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sdncontroller
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sdncontroller
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdncontroller
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: sdncontroller-controller
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          args:
            - --leader-elect={{ .Values.controller.leaderElect }}
            - --metrics-bind-address=:8080
            - --metrics-secure=false
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
